services:
  - type: web
    name: thesis-lab-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        required: true
      - key: SUPABASE_KEY
        required: true
      - key: ANTHROPIC_API_KEY
        required: true