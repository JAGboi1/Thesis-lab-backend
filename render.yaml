services:
  - type: web
    name: thesis-lab-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        required: true
      - key: SUPABASE_KEY
        required: true
      - key: ANTHROPIC_API_KEY
        required: true
