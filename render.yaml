services:
  - type: web
    name: thesis-lab-backend
    env: python
    python:
      version: "3.9.0"
    buildCommand: |
      python -m pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: SUPABASE_URL
        required: true
      - key: SUPABASE_KEY
        required: true
      - key: ANTHROPIC_API_KEY
        required: true
        required: true
